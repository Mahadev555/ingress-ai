[project]
name = "ingress-ai"
version = "0.1.0"
description = "A simple, production-oriented AI gateway with one OpenAI-compatible API over many providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "redis",
    "prometheus-client",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
